name: Daily Sign (NetEase + AliyunPan + Juejin)

on:
  schedule:
    # UTC 20:00 == 北京时间次日 04:00
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'scripts/netease-sign.js'
      - 'scripts/alipan-sign.js'
      - 'scripts/juejin-sign.js'
      - '.github/workflows/netease-sign.yml'

permissions:
  contents: read

concurrency:
  group: daily-sign
  cancel-in-progress: false

jobs:
  netease:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run NetEase sign-in
        env:
          MUSIC_U: ${{ secrets.MUSIC_U }}
          NETEASE_CSRF: ${{ secrets.NETEASE_CSRF }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          LISTEN_COUNT: ${{ vars.NETEASE_LISTEN_COUNT || '0' }}
        run: node scripts/netease-sign.js

      - name: Upload NetEase result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netease-sign-result
          path: sign-result.json
          if-no-files-found: ignore
          retention-days: 14

  alipan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AliyunPan sign-in
        env:
          ALIPAN_REFRESH_TOKEN: ${{ secrets.ALIPAN_REFRESH_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: node scripts/alipan-sign.js

      - name: Upload AliyunPan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alipan-sign-result
          path: alipan-result.json
          if-no-files-found: ignore
          retention-days: 14

  juejin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Juejin sign-in
        env:
          JUEJIN_COOKIE: ${{ secrets.JUEJIN_COOKIE }}
          JUEJIN_APPEND_URL: ${{ vars.JUEJIN_APPEND_URL || 'aid=2608' }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: node scripts/juejin-sign.js

      - name: Upload Juejin result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juejin-sign-result
          path: juejin-result.json
          if-no-files-found: ignore
          retention-days: 14
