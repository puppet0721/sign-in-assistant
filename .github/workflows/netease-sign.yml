name: NetEase Cloud Music Daily Sign

on:
  schedule:
    # UTC 20:00 == 北京时间次日 04:00
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'scripts/netease-sign.js'
      - '.github/workflows/netease-sign.yml'

permissions:
  contents: read

concurrency:
  group: netease-sign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run NetEase sign-in
        env:
          MUSIC_U: ${{ secrets.MUSIC_U }}
          NETEASE_CSRF: ${{ secrets.NETEASE_CSRF }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          LISTEN_COUNT: ${{ vars.NETEASE_LISTEN_COUNT || '0' }}
        run: node scripts/netease-sign.js

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netease-sign-result
          path: sign-result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on workflow failure
        if: failure()
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -z "$SERVERCHAN_KEY" ]; then
            echo "no SERVERCHAN_KEY, skip"
            exit 0
          fi
          curl -sS -X POST "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            --data-urlencode "title=🔴 网易云签到 Workflow 失败" \
            --data-urlencode "desp=仓库: ${{ github.repository }}%0A运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0A请检查 Actions 日志。"
