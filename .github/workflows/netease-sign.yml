name: Daily Sign (NetEase + AliyunPan)

on:
  schedule:
    # UTC 20:00 == 北京时间次日 04:00
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'scripts/netease-sign.js'
      - 'scripts/alipan-sign.js'
      - '.github/workflows/netease-sign.yml'

permissions:
  contents: read

concurrency:
  group: daily-sign
  cancel-in-progress: false

jobs:
  netease:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run NetEase sign-in
        env:
          MUSIC_U: ${{ secrets.MUSIC_U }}
          NETEASE_CSRF: ${{ secrets.NETEASE_CSRF }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          LISTEN_COUNT: ${{ vars.NETEASE_LISTEN_COUNT || '0' }}
        run: node scripts/netease-sign.js

      - name: Upload NetEase result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netease-sign-result
          path: sign-result.json
          if-no-files-found: ignore
          retention-days: 14

  alipan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 阿里云盘接口偶发网络抖动（fetch failed），重试 3 次
      - name: Run AliyunPan sign-in
        env:
          ALIPAN_REFRESH_TOKEN: ${{ secrets.ALIPAN_REFRESH_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            if node scripts/alipan-sign.js; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "失败，10 秒后重试..."
              sleep 10
            fi
          done
          echo "三次尝试均失败"
          exit 1

      - name: Upload AliyunPan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alipan-sign-result
          path: alipan-result.json
          if-no-files-found: ignore
          retention-days: 14
